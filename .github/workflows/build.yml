---
name: Build portability

on:
  push:

permissions:
  contents: read

jobs:
  fedora-rawhide:
    name: Fedora Rawhide
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: |
          docker run --rm --pull=always --platform linux/amd64 \
            --security-opt no-new-privileges=true \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            fedora:rawhide \
            sh -euxc '
              dnf -y --setopt=install_weak_deps=False install \
                gcc make autoconf automake libtool \
                pkgconf-pkg-config kernel-headers libattr-devel

              ./autogen.sh
              ./configure --without-python
              make -j32
              make -j32 check
            '

  alpine-musl:
    name: Alpine edge (musl, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: |
          docker run --rm --pull=always --platform linux/amd64 \
            --security-opt no-new-privileges=true \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            alpine:edge \
            sh -euxc '
              apk add --no-cache \
                build-base autoconf automake libtool \
                linux-headers pkgconf coreutils

              ./autogen.sh
              ./configure --without-python
              make -j32
              make -j32 check
            '
